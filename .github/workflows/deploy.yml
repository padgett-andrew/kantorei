name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (Astro & TypeScript)
        run: npm run check

      - name: Build production bundle
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1

  deploy:
    name: Deploy to Cloudflare Workers
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare deployment credentials
        id: check-creds
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deployment Pending::CLOUDFLARE_API_TOKEN is not yet configured in GitHub Secrets. Skipping automated deployment until Kantorei Cloudflare credentials are added."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check-creds.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.check-creds.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        if: steps.check-creds.outputs.configured == 'true'
        run: npm ci

      - name: Build production bundle
        if: steps.check-creds.outputs.configured == 'true'
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1

      - name: Deploy Worker via Wrangler
        if: steps.check-creds.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

